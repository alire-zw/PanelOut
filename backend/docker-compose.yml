services:
  postgres:
    image: postgres:17-alpine
    container_name: panelout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: panelout
      POSTGRES_PASSWORD: panelout
      POSTGRES_DB: panelout
    ports:
      - "5432:5432"
    volumes:
      - panelout_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelout -d panelout"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: panelout-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - panelout_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  panelout_pg_data:
  panelout_redis_data:
